<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2d5a1b">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="application-name" content="LandMemory">
  <meta name="apple-mobile-web-app-title" content="LandMemory">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/svg+xml" href="/static/icons/dandelion-icon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandMemory — Recipes</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/site-header.css">
  <style>
    /* Recipes page (Melvin, 25 Oct 2026; lighter design 28 Oct 2026). Page-scoped
       only: tokens.css / site-header.css and every shared class are untouched.
       Paper background, serif titles from local fonts only (works offline),
       season colour used sparingly (season dot, placeholder tint). The safety
       badge rule at the end is the species page's own and stays exactly as is;
       SafetyGate's warning boxes carry inline styles and keep the UI font
       (serif is set on titles only, never on an ancestor of a warning).
       Data: GET /api/recipes — approved recipes through the species page's
       culinary gate only. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rc-paper: #f7f2e7; --rc-card: #fffdf8; --rc-line: #e8dfcc; --rc-line-soft: #efe8d9;
      --rc-ink: #2b2620; --rc-text: #4f483d; --rc-muted: #857c6b; --rc-green: #4f6444;
      --rc-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      --rc-spring: #7e9471; --rc-summer: #c89b3c; --rc-autumn: #b0673a; --rc-winter: #6e8fa8; --rc-year: #8a8574;
    }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--rc-paper); color: var(--rc-text); }
    #recipes-page { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
    #recipes-page h2 { font-family: var(--rc-serif); font-size: 2rem; font-weight: 600; color: var(--rc-ink);
                       letter-spacing: 0.005em; margin-bottom: 6px; }
    #recipes-page .subtitle { font-size: 0.88rem; color: var(--rc-muted); margin-bottom: 22px; }
    .rc-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; align-items: center; }
    #recipe-search {
      flex: 1 1 240px; padding: 9px 14px; font-size: 0.92rem; min-height: 40px;
      border: 1px solid var(--rc-line); border-radius: 10px; background: var(--rc-card); color: var(--rc-ink);
    }
    #recipe-search::placeholder { color: #a39a88; }
    #recipe-search:focus { outline: none; border-color: var(--rc-spring); box-shadow: 0 0 0 3px #7e947126; }
    .rc-select {
      padding: 7px 12px; border-radius: 10px; font-size: 0.86rem; min-height: 40px;
      border: 1px solid var(--rc-line); background: var(--rc-card); color: var(--rc-ink);
    }
    .rc-group-h { font-family: var(--rc-serif); font-size: 1.2rem; font-weight: 600; color: var(--rc-ink);
                  margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rc-line); }
    .rc-group-h .n { font-family: system-ui, sans-serif; color: var(--rc-muted); font-weight: 400; font-size: 0.8rem; }
    .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .recipe-tile {
      background: var(--rc-card); border: 1px solid var(--rc-line-soft); border-radius: 14px;
      padding: 16px 18px; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 1px 2px rgba(70, 55, 30, .05); transition: box-shadow 0.15s, border-color 0.15s;
    }
    .recipe-tile:hover { box-shadow: 0 6px 18px rgba(70, 55, 30, .10); border-color: var(--rc-line); }
    .recipe-tile:focus-visible, .rc-row:focus-visible { outline: 2px solid var(--rc-spring); outline-offset: 2px; }
    .recipe-tile .rt-title { font-family: var(--rc-serif); font-size: 1.1rem; font-weight: 600; line-height: 1.3;
                             color: var(--rc-ink); }
    .rt-untitled { font-style: italic; color: var(--rc-muted) !important; font-weight: 400 !important; }
    .recipe-tile .rt-species { font-size: 0.82rem; color: var(--rc-green); }
    .recipe-tile .rt-species em { color: #7d8a70; }
    .recipe-tile .rt-summary { font-size: 0.85rem; color: var(--rc-text); line-height: 1.5; }
    .recipe-tile .rt-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
    .rt-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; padding: 2px 9px;
               border-radius: 999px; background: #f2ecdf; color: #6b604c; }
    .rt-chip.curator { background: #f0e8f0; color: #5b3a4e; }
    .rt-season::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--rc-year); }
    .rt-season.s-spring::before { background: var(--rc-spring); }
    .rt-season.s-summer::before { background: var(--rc-summer); }
    .rt-season.s-autumn::before { background: var(--rc-autumn); }
    .rt-season.s-winter::before { background: var(--rc-winter); }
    .recipe-tile details, .rc-table details { margin-top: 2px; font-size: 0.78rem; }
    /* The warnings toggle: the warning box's own text colour, legible on paper. */
    .recipe-tile details summary, .rc-table details summary { cursor: pointer; color: #7a2000; font-weight: 600; }
    .rc-state { color: var(--rc-muted); padding: 40px 0; text-align: center; }
    @media (max-width: 640px) {
      #recipes-page { padding: 20px 14px 48px; }
      #recipes-page h2 { font-size: 1.6rem; padding-left: 52px; }   /* clear of the fixed nav chip */
      .recipe-tile { padding: 13px 14px; }
    }

    /* Large / Grid / List (28 Oct 2026) — the switch is static/js/view-switch.js,
       shared with the species page; these rules are this page's own. */
    .rc-view-toggle { display: inline-flex; flex-shrink: 0; border: 1px solid var(--rc-line); border-radius: 10px;
                      overflow: hidden; background: var(--rc-card); }
    .rc-view-btn {
      background: transparent; color: #9a917f; border: 0; padding: 0 11px; min-height: 40px; min-width: 40px;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .rc-view-btn + .rc-view-btn { border-left: 1px solid var(--rc-line); }
    .rc-view-btn.active { background: #e9efe2; color: var(--rc-green); }
    .rc-view-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .recipe-grid.rc-large { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
    .rc-thumb { position: relative; overflow: hidden; background: #efede6; color: var(--rc-year); }
    .rc-thumb.rc-season-spring { background: #eef2e6; color: var(--rc-spring); }
    .rc-thumb.rc-season-summer { background: #f6eedb; color: var(--rc-summer); }
    .rc-thumb.rc-season-autumn { background: #f4e7dc; color: var(--rc-autumn); }
    .rc-thumb.rc-season-winter { background: #e8eef3; color: var(--rc-winter); }
    .rc-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .rc-thumb .rc-ph { position: absolute; inset: 0; margin: auto; width: 52%; height: 52%; }
    .rc-thumb-lg { margin: -16px -18px 10px; aspect-ratio: 4 / 3; border-radius: 14px 14px 0 0; }
    .rc-thumb-sm { width: 46px; height: 46px; border-radius: 8px; }
    .rc-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.86rem;
                background: var(--rc-card); border: 1px solid var(--rc-line-soft); border-radius: 14px; overflow: hidden; }
    .rc-table th { text-align: left; padding: 0; border-bottom: 1px solid var(--rc-line); background: #fbf8f1; }
    .rc-sort-btn { background: none; border: 0; color: var(--rc-green); font: inherit; font-weight: 600; font-size: 0.8rem;
                   padding: 9px 10px; cursor: pointer; width: 100%; text-align: left; }
    .rc-table td { padding: 8px 10px; border-bottom: 1px solid var(--rc-line-soft); vertical-align: middle;
                   overflow-wrap: anywhere; color: var(--rc-text); }
    .rc-table tbody tr:last-child td { border-bottom: 0; }
    .rc-row { cursor: pointer; }
    .rc-row:hover { background: #fbf7ee; }
    .rc-table .col-thumb { width: 66px; }
    .rc-table .col-season { width: 112px; }
    .rc-table .col-safety { width: 118px; }
    .rc-table .rl-title { font-family: var(--rc-serif); font-size: 1rem; font-weight: 600; color: var(--rc-ink); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 640px) {
      .rc-table .col-thumb { width: 58px; }
      .rc-table .col-season { width: 84px; }
      .rc-table .col-safety { width: 96px; }
    }
    /* The species list's badge (LmViewSwitch.badge) — the species page's own
       .sp-table badge styling, so a recipe shows exactly the species badge. */
    #rc-results .obs-badge, #rc-results .inedible-badge {
      display: inline-block; font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
    #rc-results .inedible-badge { background: #fef3c7; color: #854d0e; font-weight: 400; }
  </style>
</head>
<body>

<!-- Nav chip + drawer injected by /static/js/site-header.js (Map Redesign P3-nav) -->

<div id="recipes-page">
  <h2>Recipes</h2>
  <div class="subtitle" id="rc-subtitle">Approved recipes from the species pages. Tap one to open it.</div>
  <div class="rc-controls">
    <input id="recipe-search" type="search" placeholder="Search an ingredient, dish or plant…"
           aria-label="Search recipes">
    <select id="rc-view" class="rc-select" aria-label="View">
      <option value="now">In season now</option>
      <option value="season">By season</option>
      <option value="walk">By walk</option>
      <option value="type">By type</option>
      <option value="species">By species</option>
      <option value="part">By plant part</option>
      <option value="az">A–Z</option>
      <option value="recent">Recently added</option>
    </select>
    <select id="rc-walk" class="rc-select" aria-label="Walk" style="display:none"></select>
    <!-- Large / Grid / List — buttons from LmViewSwitch.toggleHtml (view-switch.js), setRecipesView() -->
    <div class="rc-view-toggle" id="rc-view-toggle" role="group" aria-label="Layout"></div>
  </div>
  <div id="rc-results"><div class="rc-state">Loading…</div></div>
</div>

<script src="/static/js/esc.js"></script>
<script src="/static/js/safety-gate.js"></script>
<script src="/static/js/species-names.js"></script>
<script src="/static/js/view-switch.js"></script>
<script>
// ── Recipes page ──────────────────────────────────────────────────────────
// GET /api/recipes (app/api/recipes.py all_recipes): approved, non-medicinal,
// culinary-allowed recipes only; `safety` is the served decision per species
// (SafetyGate is the only reader — a recipe whose species fails it is dropped
// here too, fail closed). Query: ?view=…&walk=<saved walk id> (Find → Make?).
const SEASONS = ['spring', 'summer', 'autumn', 'winter', 'year-round'];
const SEASON_LABEL = { spring: '🌱 Spring', summer: '☀️ Summer', autumn: '🍂 Autumn', winter: '❄️ Winter', 'year-round': '🔄 Year-round' };
const TYPE_LABEL = { drink: 'Drinks', ferment: 'Ferments', condiment: 'Condiments', preserve: 'Preserves',
                     main: 'Mains', side: 'Sides', sweet: 'Sweet', other: 'Other' };
const PART_LABEL = { flower: 'Flowers', leaf: 'Leaves', shoot: 'Shoots & stems', berry: 'Fruit & berries',
                     seed: 'Seeds & nuts', root: 'Roots', bark: 'Bark, sap & needles', whole: 'Mushrooms' };

let _data = { recipes: [], safety: {}, types: [] };
let _q = '';
const _params = new URLSearchParams(location.search);

function _esc(s) { return window.lmEsc(s); }

// Today's season (same months as the species page recipe tabs).
function currentSeason(d) {
  const m = (d || new Date()).getMonth();
  return m <= 1 || m === 11 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
}

function recipeHref(r) {
  return `/species?s=${encodeURIComponent(r.species.scientific_name)}&recipe=${r.id}#recipe-card-${r.id}`;
}

// Large / Grid / List (28 Oct 2026): the switch is LmViewSwitch
// (static/js/view-switch.js), shared with the species page; this page keeps
// its own remembered view.
const _RC_VIEW_KEY = 'foragingid_recipes_view';
let _rcView = LmViewSwitch.stored(_RC_VIEW_KEY, 'grid');
let _rcListSort = { key: 'safety', dir: 1 };   // List view: safety first, as the species list offers

// The species' badge — the species list's own (LmViewSwitch.badge → SafetyGate).
function _rcSpecies(r) {
  return { safety: _data.safety[String(r.species.id)], edibility_status: r.species.edibility_status,
           condition_count: r.species.condition_count };
}
function _rcBadge(r) { return LmViewSwitch.badge(_rcSpecies(r)); }

// Thumbnail: the species' best confirmed photo (the species list's rule,
// served as species.thumbnail), lazy-loaded over a drawn placeholder that
// shows when there is no photo or it fails to load.
const _RC_PLACEHOLDER = '<svg class="rc-ph" viewBox="0 0 64 48" aria-hidden="true">' +
  '<path d="M9 25h46a23 15 0 0 1-46 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
  '<path d="M6 25h52" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
  '<path d="M33 21c-1-8 5-14 13-15-1 8-6 13-13 15z" fill="currentColor" opacity=".45"/>' +
  '<path d="M33 21c1-4 4-8 9-11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
  '<path d="M27 21c-5-3-11-2-14 1 4 3 10 3 14-1z" fill="currentColor" opacity=".3"/></svg>';
function _rcThumb(r, cls) {
  const f = r.species.thumbnail;
  return `<div class="rc-thumb ${cls} rc-season-${_esc(r.season)}">${_RC_PLACEHOLDER}` +
    (f ? `<img src="/thumbnails/${_esc(f)}" loading="lazy" alt="" onerror="this.remove()">` : '') + '</div>';
}

// The shown title: the served one (own or heading — recipe_list_title), else
// "Untitled recipe" with its species. Never a first sentence, never a warning.
function _rcTitle(r) {
  return r.title || `Untitled recipe · ${r.species.common || r.species.scientific_name}`;
}

function _rcChips(r) {
  return [
    `<span class="rt-chip rt-season s-${_esc(r.season)}">${_esc(SEASON_LABEL[r.season] || r.season)}</span>`,
    `<span class="rt-chip">${_esc(TYPE_LABEL[r.recipe_type || 'other'])}</span>`,
    r.needs_title ? `<span class="rt-chip curator" data-guest-hide title="This recipe has no title yet — type one on its species page">needs a title</span>` : '',
    r.hide_from_public ? `<span class="rt-chip curator" data-guest-hide>hidden from public</span>` : '',
  ].join('');
}

// Grid / Large card (Large adds the photo).
function tileHtml(r) {
  const safety = _data.safety[String(r.species.id)];
  const warn = SafetyGate.culinaryWarnings(safety);
  return `<div class="recipe-tile" role="link" tabindex="0" data-href="${_esc(recipeHref(r))}" data-recipe-id="${r.id}" data-name="${r.id}">
    ${_rcView === 'large' ? _rcThumb(r, 'rc-thumb-lg') : ''}
    <div class="rt-title${r.title ? '' : ' rt-untitled'}">${_esc(_rcTitle(r))}</div>
    <div class="rt-species">${spNameHtml(r.species.scientific_name, r.species.common)}</div>
    ${r.summary ? `<div class="rt-summary">${_esc(r.summary)}</div>` : ''}
    <div class="rt-meta">${_rcChips(r)}${_rcBadge(r)}</div>
    ${warn ? `<details><summary>⚠ Warnings</summary>${warn}</details>` : ''}
  </div>`;
}

// List view: title, species (display common name), season, badge; sortable,
// safety first by default (deadly, toxic, unknown, caution, edible, not edible).
const _RC_SORTS = {
  title:   r => _rcTitle(r).toLowerCase(),
  species: r => (r.species.common || r.species.scientific_name).toLowerCase(),
  season:  r => SEASONS.indexOf(r.season),
  safety:  r => LmViewSwitch.safetyRank(_data.safety[String(r.species.id)]),
};
function _rcSorted(items) {
  const f = _RC_SORTS[_rcListSort.key] || _RC_SORTS.safety;
  const dir = _rcListSort.dir;
  return [...items].sort((a, b) => {
    const x = f(a), y = f(b);
    const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
    return c ? c * dir : _byTitle(a, b);
  });
}
function sortRecipesList(key) {
  if (!_RC_SORTS[key]) return;
  _rcListSort = _rcListSort.key === key ? { key, dir: -_rcListSort.dir } : { key, dir: 1 };
  render();
}
function rowHtml(r) {
  const safety = _data.safety[String(r.species.id)];
  const warn = SafetyGate.culinaryWarnings(safety);
  const sp = r.species.common ? _esc(r.species.common) : `<em>${_esc(r.species.scientific_name)}</em>`;
  return `<tr class="rc-row" role="link" tabindex="0" data-href="${_esc(recipeHref(r))}" data-recipe-id="${r.id}" data-name="${r.id}">
    <td class="col-thumb">${_rcThumb(r, 'rc-thumb-sm')}</td>
    <td class="col-title"><div class="rl-title${r.title ? '' : ' rt-untitled'}">${_esc(_rcTitle(r))}</div>
      ${warn ? `<details><summary>⚠ Warnings</summary>${warn}</details>` : ''}</td>
    <td class="col-species" title="${_esc(r.species.scientific_name)}">${sp}</td>
    <td class="col-season">${_esc(SEASON_LABEL[r.season] || r.season)}</td>
    <td class="col-safety">${_rcBadge(r)}</td>
  </tr>`;
}
function listHtml(items) {
  const th = (key, label, cls) => {
    const on = _rcListSort.key === key;
    const arrow = on ? (_rcListSort.dir > 0 ? ' ▲' : ' ▼') : '';
    return `<th class="${cls}" aria-sort="${on ? (_rcListSort.dir > 0 ? 'ascending' : 'descending') : 'none'}">
      <button type="button" class="rc-sort-btn" onclick="sortRecipesList('${key}')">${label}${arrow}</button></th>`;
  };
  return `<table class="rc-table"><thead><tr>
      <th class="col-thumb"><span class="sr-only">Photo</span></th>
      ${th('title', 'Recipe', 'col-title')}${th('species', 'Species', 'col-species')}
      ${th('season', 'Season', 'col-season')}${th('safety', 'Safety', 'col-safety')}
    </tr></thead><tbody>${_rcSorted(items).map(rowHtml).join('')}</tbody></table>`;
}

function setRecipesView(view) {
  if (!LmViewSwitch.VIEWS.includes(view) || view === _rcView) return;
  const anchor = LmViewSwitch.firstVisible('#rc-results [data-name]');
  _rcView = view;
  LmViewSwitch.remember(_RC_VIEW_KEY, view);
  LmViewSwitch.sync('.rc-view-btn', _rcView);
  render();
  LmViewSwitch.scrollTo(anchor, '#rc-results [data-name]');
}

function _visible() {
  // Fail closed: a recipe whose species decision is missing or blocks culinary
  // content is never drawn (the server already filtered it).
  return _data.recipes.filter(r => SafetyGate.allowed(_data.safety[String(r.species.id)]));
}

const _byTitle = (a, b) => _rcTitle(a).localeCompare(_rcTitle(b));

function groupsFor(view, list) {
  const out = [];
  const add = (key, label, items) => { if (items.length) out.push({ key, label, items: items.slice().sort(_byTitle) }); };
  if (view === 'now') {
    const s = currentSeason();
    add(s, `In season now — ${SEASON_LABEL[s]}`, list.filter(r => r.season === s));
    add('year-round', SEASON_LABEL['year-round'], list.filter(r => r.season === 'year-round'));
  } else if (view === 'season') {
    SEASONS.forEach(s => add(s, SEASON_LABEL[s], list.filter(r => r.season === s)));
  } else if (view === 'walk') {
    const walkId = document.getElementById('rc-walk').value;
    const walks = _allWalks().filter(w => !walkId || String(w.id) === walkId);
    walks.forEach(w => add(`walk-${w.id}`, w.name, list.filter(r => r.walks.some(x => x.id === w.id))));
    if (!walkId) add('no-walk', 'Not on a saved walk', list.filter(r => !r.walks.length));
  } else if (view === 'type') {
    Object.keys(TYPE_LABEL).forEach(t => add(t, TYPE_LABEL[t], list.filter(r => (r.recipe_type || 'other') === t)));
  } else if (view === 'species') {
    const by = new Map();
    list.forEach(r => {
      const k = r.species.scientific_name;
      if (!by.has(k)) by.set(k, { label: spNameText(r.species.scientific_name, r.species.common), items: [] });
      by.get(k).items.push(r);
    });
    [...by.entries()].sort((a, b) => a[1].label.localeCompare(b[1].label))
      .forEach(([k, g]) => add(k, g.label, g.items));
  } else if (view === 'part') {
    Object.keys(PART_LABEL).forEach(p => add(p, PART_LABEL[p], list.filter(r => r.parts.includes(p))));
    add('none', 'Part not named', list.filter(r => !r.parts.length));
  } else if (view === 'recent') {
    out.push({ key: 'recent', label: 'Recently added',
               items: list.slice().sort((a, b) => (b.approved_at || '').localeCompare(a.approved_at || '')) });
  } else {
    out.push({ key: 'az', label: 'A–Z', items: list.slice().sort(_byTitle) });
  }
  return out;
}

function _allWalks() {
  const m = new Map();
  _data.recipes.forEach(r => r.walks.forEach(w => m.set(w.id, w)));
  return [...m.values()].sort((a, b) => a.id - b.id);
}

function render() {
  const view = document.getElementById('rc-view').value;
  const walkSel = document.getElementById('rc-walk');
  walkSel.style.display = view === 'walk' ? '' : 'none';
  const el = document.getElementById('rc-results');
  const list = _visible();
  if (!list.length) {
    el.innerHTML = `<div class="rc-state">${_q ? `No recipes found for “${_esc(_q)}”.` : 'No recipes yet.'}</div>`;
    return;
  }
  const groups = groupsFor(view, list);
  const body = items => _rcView === 'list' ? listHtml(items)
    : `<div class="recipe-grid${_rcView === 'large' ? ' rc-large' : ''}">${items.map(tileHtml).join('')}</div>`;
  el.innerHTML = groups.length ? groups.map(g => `
    <div class="rc-group-h">${_esc(g.label)} <span class="n">· ${g.items.length}</span></div>
    ${body(g.items)}`).join('')
    : '<div class="rc-state">Nothing in this view.</div>';
  document.getElementById('rc-subtitle').textContent =
    `${list.length} approved recipe${list.length === 1 ? '' : 's'}${_q ? ` matching “${_q}”` : ''}. Tap one to open it on its species page.`;
}

async function load() {
  const url = '/api/recipes' + (_q ? `?q=${encodeURIComponent(_q)}` : '');
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    _data = await r.json();
  } catch (e) {
    document.getElementById('rc-results').innerHTML = `<div class="rc-state">❌ ${_esc(e.message)}</div>`;
    return;
  }
  const walkSel = document.getElementById('rc-walk');
  const keep = walkSel.value || _params.get('walk') || '';
  walkSel.innerHTML = '<option value="">All walks</option>' +
    _allWalks().map(w => `<option value="${w.id}">${_esc(w.name)}</option>`).join('');
  if ([...walkSel.options].some(o => o.value === keep)) walkSel.value = keep;
  render();
}

// Tile / row → species page at that recipe card (species.html opens and highlights it).
document.getElementById('rc-results').addEventListener('click', e => {
  if (e.target.closest('details')) return;          // the warnings toggle, not a navigation
  const t = e.target.closest('[data-href]');
  if (t) location.href = t.dataset.href;
});
document.getElementById('rc-results').addEventListener('keydown', e => {
  if (e.target.closest('details')) return;
  const t = e.target.closest('[data-href]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.href = t.dataset.href; }
});
document.getElementById('rc-view').addEventListener('change', render);
document.getElementById('rc-walk').addEventListener('change', render);
let _qTimer = null;
document.getElementById('recipe-search').addEventListener('input', e => {
  clearTimeout(_qTimer);
  _qTimer = setTimeout(() => { _q = e.target.value.trim(); load(); }, 300);
});

(function init() {
  document.getElementById('rc-view-toggle').innerHTML = LmViewSwitch.toggleHtml('rc-view-btn', 'setRecipesView');
  LmViewSwitch.sync('.rc-view-btn', _rcView);
  const v = _params.get('view') || (_params.get('walk') ? 'walk' : 'now');
  const sel = document.getElementById('rc-view');
  if ([...sel.options].some(o => o.value === v)) sel.value = v;
  load();
})();
</script>
