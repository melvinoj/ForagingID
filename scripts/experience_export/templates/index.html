<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
{{CANONICAL}}
{{LEAFLET_CSS}}
<style>
/* ════ App styles — copied from the app at build time (app_styles.py) ════ */
{{APP_STYLES}}

/* ════ Page layout — composes the app's tokens and classes ════ */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--app-shell); color: var(--app-text); font-family: var(--font-ui);
    line-height: 1.45; overflow-x: hidden; }
  /* Page images only — never Leaflet's tiles/markers (Leaflet sizes those itself). */
  img:not(.leaflet-container img) { max-width: 100%; display: block; }
  a { color: var(--leaf-pale); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  header.hero { background: var(--app-shell-deep); padding: 26px 0 20px; border-bottom: 2px solid var(--app-forest); }
  .hero h1 { font-family: var(--font-display); font-weight: 400; color: var(--app-heading);
    font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; margin: 0 0 8px; }
  .hero p { margin: 0 0 12px; max-width: 62ch; }
  .meta { font-size: 0.8rem; color: var(--moss-light); margin-bottom: 16px; }
  .cta { display: inline-flex; align-items: center; min-height: var(--touch-min); padding: 0 20px;
    background: var(--app-forest); color: var(--paper); border-radius: 7px; font-weight: 600;
    text-decoration: none; border: 1.5px solid var(--leaf); }
  .cta:hover { background: var(--moss); }

  nav.tabs { position: sticky; top: 0; z-index: 1000; background: var(--app-shell-deep);
    border-bottom: 1px solid rgba(255,255,255,.08); }
  .tabs .wrap { display: flex; }
  .tab { flex: 1; min-height: var(--touch-min); appearance: none; border: 0; background: none;
    font: 600 0.9rem var(--font-ui); color: var(--moss-light); border-bottom: 3px solid transparent; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--leaf-pale); border-bottom-color: var(--leaf); }

  section.panel { padding: 18px 0 28px; }
  section.panel[hidden] { display: none; }
  #list-view h2 { font-family: var(--font-display); font-weight: 400; }

  #map { height: 58vh; min-height: 300px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); }
  /* Leaflet's default container colour is #ddd; any hairline gap between tiles
     (fractional-pixel tile positions) shows that through as a near-white grid line.
     Dark here so a gap, if any, matches the page instead. */
  .leaflet-container { background: var(--app-shell-deep); }
  .leaflet-container img { box-sizing: content-box; }
  .stop-pin { width: 26px; height: 26px; border-radius: 50%; background: var(--app-forest); color: #fff;
    font: 700 12px/26px var(--font-ui); text-align: center; border: 2px solid var(--paper);
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  .stops { margin-top: 16px; }
  .stop-head { display: flex; align-items: center; gap: 2px; cursor: pointer; min-height: 28px;
    color: var(--ink); font-size: 0.8rem; font-weight: 600; }
  .stop-head .badge { margin-left: 6px; }
  .walk-stop-sp { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .walk-stop-sp + .walk-stop-sp { border-top: 1px dashed #e3ead7; padding-top: 8px; }
  .walk-stop-sp img, .walk-stop-sp .noimg { width: 52px; height: 52px; border-radius: 6px; object-fit: cover;
    flex: 0 0 auto; background: var(--leaf-pale); }
  .walk-stop-species { font-family: var(--font-display); font-style: italic; }

  #tree-frame-wrap { height: 70vh; min-height: 360px; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); background: var(--app-shell-deep); }
  #tree-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); margin-top: 16px; }
  .grid .species-card { padding: 0; overflow: hidden; cursor: default; }
  .grid .species-card.toxic { border: 2px solid var(--app-toxic); }
  .species-card .photo { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; background: var(--app-shell-deep); cursor: zoom-in; }
  .species-card .body { padding: 12px 14px 14px; }
  .species-card .common { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
  .species-card .badge { margin-top: 6px; }
  .warn { margin-top: 8px; font-size: 0.8rem; border-radius: 0 6px 6px 0; padding: 7px 9px; line-height: 1.4; }
  .warn.toxic { background: rgba(220,38,38,.14); color: #fecaca; border-left: 3px solid var(--app-toxic); }
  .warn.lookalike { background: rgba(200,155,60,.14); color: #f3e2bb; border-left: 3px solid var(--amber); }
  .warn strong { display: block; margin-bottom: 2px; }
  .species-card .walk-stop-recipe { margin: 8px 0 0; }
  .walk-stop-recipe .line { margin-top: 3px; font-style: italic; line-height: 1.4; }
  .note-box { background: var(--app-shell-deep); border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0;
    padding: 9px 12px; color: var(--leaf-pale); font-weight: 600; margin: 0; }

  footer { background: var(--app-shell-deep); border-top: 2px solid var(--app-forest); padding: 22px 0 36px;
    font-size: 0.8rem; color: var(--moss-light); }
  footer h2 { font-family: var(--font-display); font-weight: 400; font-size: 1rem; color: var(--app-heading); margin: 0 0 8px; }
  footer p { margin: 0 0 10px; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; }
  .footer-links a { display: inline-flex; align-items: center; min-height: var(--touch-min); }
  .placeholder { color: var(--alert); font-weight: 700; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 2000; display: none;
    align-items: center; justify-content: center; padding: 16px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-height: 90vh; border-radius: 8px; }
  .leaflet-popup-content { margin: 10px 12px; min-width: 210px; font-family: var(--font-ui); }
  .locate-btn { width: var(--touch-min); height: var(--touch-min); border-radius: 6px; border: 2px solid rgba(0,0,0,.2);
    background: var(--paper); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
  .locate-btn:disabled { opacity: .5; }
  .leaflet-control-layers { font-family: var(--font-ui); }
  .leaflet-popup-content .walk-stop-sp:first-of-type { margin-top: 4px; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
    <a class="cta" id="cta" href="#" target="_top" rel="noopener"></a>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-walk" aria-controls="panel-walk" aria-selected="true">Walk</button>
    <button class="tab" role="tab" id="tab-plants" aria-controls="panel-plants" aria-selected="false">Plants</button>
    <button class="tab" role="tab" id="tab-recipes" aria-controls="panel-recipes" aria-selected="false">Recipes</button>
  </div>
</nav>

<main id="list-view">
  <section class="panel" id="panel-walk" role="tabpanel" aria-labelledby="tab-walk">
    <div class="wrap">
      <h2>The route</h2>
      <p class="subtitle">Numbered stops follow the walk.</p>
      <div id="map" role="region" aria-label="Walk map"></div>
      <div class="stops walk-stops" id="stops"></div>
    </div>
  </section>

  <section class="panel" id="panel-plants" role="tabpanel" aria-labelledby="tab-plants" hidden>
    <div class="wrap">
      <h2>Plants on this walk</h2>
      <p class="subtitle">A family tree of everything we meet on the way. Tap a branch to open it, tap a species for its photo.</p>
      <div id="tree-frame-wrap"></div>
      <div class="grid" id="species-grid"></div>
    </div>
  </section>

  <section class="panel" id="panel-recipes" role="tabpanel" aria-labelledby="tab-recipes" hidden>
    <div class="wrap">
      <h2>From the walk to the plate</h2>
      <p class="note-box">A taste of what we cook — full recipes on the day.</p>
      <div class="grid" id="recipe-grid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <h2 id="disclaimer-h"></h2>
    <div id="disclaimer"></div>
    <div class="footer-links" id="footer-links"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo"><img alt=""></div>

<script>
window.DATA = {{DATA}};
</script>
{{LEAFLET_JS}}
<script>
(function () {
  "use strict";
  var D = window.DATA;
  var byId = {};
  D.species.forEach(function (s) { byId[s.id] = s; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function badge(s) { return '<span class="badge ' + esc(s.badge.kind) + '">' + esc(s.badge.text) + "</span>"; }
  function img(src, alt) {
    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : '<div class="noimg"></div>';
  }
  // Same order as the app's walk panel: scientific name, common name, then the badge.
  function stopSpecies(s) {
    var common = [s.en, s.de].filter(Boolean).join(" · ");
    return '<div class="walk-stop-sp">' + img(s.thumb, s.en || s.sci) + "<div>" +
      '<span class="walk-stop-species">' + esc(s.sci) + "</span>" +
      (common ? '<div class="walk-stop-common">' + esc(common) + "</div>" : "") +
      '<div class="walk-stop-meta">' + badge(s) + "</div></div></div>";
  }

  // ── header ──
  document.title = D.title;
  document.getElementById("title").textContent = D.title;
  document.getElementById("intro").textContent = D.intro;
  var km = D.walk.distance_m ? (D.walk.distance_m / 1000).toFixed(1) + " km" : "";
  var hrs = D.walk.duration_min ? "about " + (Math.round(D.walk.duration_min / 30) / 2) + " h walking" : "";
  document.getElementById("meta").textContent =
    [km, hrs, D.walk.stops.length + " stops", D.species.length + " species"].filter(Boolean).join(" · ");
  var cta = document.getElementById("cta");
  cta.textContent = D.cta_label; cta.href = D.contact_url;

  // ── tabs ──
  var tabs = ["walk", "plants", "recipes"];
  var treeLoaded = false, map = null;
  function show(name) {
    if (tabs.indexOf(name) < 0) name = "walk";
    tabs.forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
      document.getElementById("panel-" + t).hidden = t !== name;
    });
    if (name === "plants" && !treeLoaded) {
      // Created on first open so the tree lays out at its real size.
      var f = document.createElement("iframe");
      f.src = "tree.html"; f.title = "Plant family tree";
      document.getElementById("tree-frame-wrap").appendChild(f);
      treeLoaded = true;
    }
    if (name === "walk" && map) setTimeout(function () { map.invalidateSize(); }, 0);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(function (t) {
    document.getElementById("tab-" + t).addEventListener("click", function () { show(t); });
  });

  // ── walk: stop cards in the app's walk-panel layout ──
  var stopsEl = document.getElementById("stops");
  stopsEl.innerHTML = D.walk.stops.map(function (st) {
    // Plain numbered stop; toxicity is shown only on the plant (its badge).
    return '<div class="walk-stop-card" id="stop-' + st.n + '">' +
      '<div class="stop-head" data-stop="' + st.n + '"><span class="walk-stop-num">' + st.n + "</span>" +
      (st.species.length > 1 ? st.species.length + " species here" : "Stop " + st.n) + "</div>" +
      st.species.map(function (id) { return stopSpecies(byId[id]); }).join("") + "</div>";
  }).join("");

  var markers = {};
  if (window.L) {
    map = L.map("map", { scrollWheelZoom: false });
    // Same keyless base layers as the app (frontend/index.html _baseLayers). No API keys.
    var base = {
      "Standard": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors', maxZoom: 19 }),
      "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS, AeroGRID, IGN, and the GIS User Community", maxZoom: 19 }),
      "Topo": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: 'Map data: &copy; <a href="https://openstreetmap.org/copyright" target="_top">OpenStreetMap</a> contributors, SRTM | Display: &copy; <a href="https://opentopomap.org" target="_top">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_top">CC-BY-SA</a>)',
        maxZoom: 17, subdomains: ["a", "b", "c"] })
    };
    base["Standard"].addTo(map);
    L.control.layers(base, null, { position: "topright", collapsed: true }).addTo(map);

    // Locate me — browser geolocation, shown on the map only. Nothing is stored or sent.
    var here = null;
    var Locate = L.Control.extend({
      options: { position: "topleft" },
      onAdd: function () {
        var b = L.DomUtil.create("button", "locate-btn");
        b.type = "button"; b.title = "Show my location"; b.setAttribute("aria-label", "Show my location");
        b.textContent = "◎";
        L.DomEvent.disableClickPropagation(b);
        L.DomEvent.on(b, "click", function () {
          if (!navigator.geolocation) { alert("Location isn't available in this browser."); return; }
          b.disabled = true;
          navigator.geolocation.getCurrentPosition(function (pos) {
            b.disabled = false;
            var ll = [pos.coords.latitude, pos.coords.longitude];
            if (here) here.remove();
            here = L.layerGroup([
              L.circle(ll, { radius: pos.coords.accuracy, color: "#6E8FA8", weight: 1, fillOpacity: 0.12 }),
              L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#6E8FA8", fillOpacity: 1 })
            ]).addTo(map);
            map.setView(ll, Math.max(map.getZoom(), 15));
          }, function (err) {
            b.disabled = false;
            alert(err.code === 1 ? "Location permission was refused." : "Couldn't get your location.");
          }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        });
        return b;
      }
    });
    map.addControl(new Locate());
    var bounds = [];
    if (D.walk.line) {
      var ll = D.walk.line.map(function (c) { return [c[1], c[0]]; });
      L.polyline(ll, { color: getComputedStyle(document.documentElement).getPropertyValue("--app-forest").trim() || "#2d5016",
                       weight: 4, opacity: 0.9 }).addTo(map);
      bounds = bounds.concat(ll);
    }
    D.walk.stops.forEach(function (st) {
      var icon = L.divIcon({ className: "", iconSize: [26, 26], html: '<div class="stop-pin">' + st.n + "</div>" });
      var m = L.marker([st.lat, st.lng], { icon: icon, title: "Stop " + st.n })
        .addTo(map)
        .bindPopup('<div class="stop-head"><span class="walk-stop-num">' + st.n + "</span>Stop " + st.n + "</div>" +
                   st.species.map(function (id) { return stopSpecies(byId[id]); }).join(""), { maxWidth: 290 });
      markers[st.n] = m;
      bounds.push([st.lat, st.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
  } else {
    document.getElementById("map").innerHTML = '<p class="subtitle" style="padding:12px">Map could not load (offline?).</p>';
  }
  stopsEl.addEventListener("click", function (e) {
    var h = e.target.closest(".stop-head[data-stop]");
    if (!h || !map) return;
    var m = markers[h.getAttribute("data-stop")];
    document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
    m.openPopup();
  });

  // ── plants: the app's species cards ──
  document.getElementById("species-grid").innerHTML = D.species.map(function (s) {
    var w = "";
    if (s.safety.toxic) w += '<div class="warn toxic"><strong>☠ Not safe to eat</strong>' + esc(s.safety.toxic) + "</div>";
    if (s.safety.look_alike) w += '<div class="warn lookalike"><strong>Look-alikes</strong>' + esc(s.safety.look_alike) + "</div>";
    return '<article class="species-card' + (s.toxic ? " toxic" : "") + '">' +
      (s.photo ? '<img class="photo" src="' + esc(s.thumb) + '" data-full="' + esc(s.photo) + '" alt="' + esc(s.en || s.sci) + '" loading="lazy">'
               : '<div class="photo"></div>') +
      '<div class="body"><div class="common">' + (s.toxic ? "☠ " : "") + esc(s.en || s.sci) + "</div>" +
      '<div class="sci-name">' + esc(s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") +
      (s.family ? '<div class="family">' + esc(s.family) + "</div>" : "") + badge(s) + w + "</div></article>";
  }).join("");

  // ── recipes: teaser in the app's walk-panel recipe strip ──
  var rg = document.getElementById("recipe-grid");
  rg.innerHTML = D.recipes.length ? D.recipes.map(function (r) {
    var s = byId[r.species_id];
    return '<article class="species-card">' +
      (s.photo ? '<img class="photo" src="' + esc(s.thumb) + '" data-full="' + esc(s.photo) + '" alt="' + esc(s.en || s.sci) + '" loading="lazy">' : "") +
      '<div class="body"><div class="common">' + esc(s.en || s.sci) + "</div>" +
      (s.de ? '<div class="common-de">' + esc(s.de) + "</div>" : "") + badge(s) +
      '<div class="walk-stop-recipe"><strong>' + esc(r.dish) + '</strong><div class="line">' + esc(r.line) + "</div></div>" +
      "</div></article>";
  }).join("") : '<p class="subtitle">Recipes to follow.</p>';

  // ── footer ──
  document.getElementById("disclaimer-h").textContent = D.disclaimer.heading;
  document.getElementById("disclaimer").innerHTML = D.disclaimer.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  document.getElementById("footer-links").innerHTML =
    '<a href="' + esc(D.contact_url) + '" target="_top" rel="noopener">Contact</a>' +
    (D.impressum_url ? '<a href="' + esc(D.impressum_url) + '" target="_top" rel="noopener">Impressum</a>'
                     : '<span class="placeholder">Impressum (link to follow)</span>');

  // ── photo lightbox ──
  var lb = document.getElementById("lightbox");
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.matches && t.matches("img[data-full]")) { lb.querySelector("img").src = t.getAttribute("data-full"); lb.classList.add("open"); }
    else if (t === lb || t.parentNode === lb) { lb.classList.remove("open"); }
  });

  show((location.hash || "#walk").slice(1));
})();
</script>
</body>
</html>
